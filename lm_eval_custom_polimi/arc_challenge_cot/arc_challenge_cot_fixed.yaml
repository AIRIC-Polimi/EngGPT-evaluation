tag: EngGPT
task: arc_challenge_cot_fixed
dataset_path: allenai/ai2_arc
dataset_name: ARC-Challenge
output_type: generate_until
training_split: train
validation_split: validation
test_split: test
fewshot_split: train
doc_to_text: "Given the following question and four candidate answers (A, B, C and D), choose the best answer.\nQuestion: {{question.strip()}}\nA. {{choices.text[0]}}\nB. {{choices.text[1]}}\nC. {{choices.text[2]}}{% if choices.text|length > 3 %}\nD. {{choices.text[3]}}{% endif %}\n- For simple problems:\nGive directly the answer with a minimal explanation\n- For complex problems:\nReason step by step using the following format:\n## Step 1: [Concise description]\n[Short explanation]\n## Step 2: [Concise description]\n[Short explanation]\nIndependently from the approach, always end with:\nThe correct answer is [letter_of_the_answer].\nwhere [letter_of_the_answer] is one among A, B, C or D.\nThink step by step."
fewshot_delimiter: "\n\n"
doc_to_target: "{{ 'ABCD'[answerKey|int - 1] if answerKey|string in '1234' else answerKey }}"
generation_kwargs:
  until:
    - "</s>"
  max_gen_toks: 4096
metric_list:
- aggregation: mean
  higher_is_better: true
  ignore_case: true
  ignore_punctuation: true
  metric: exact_match
filter_list:
  - name: flexible_extract
    filter:
      - function: regex
        regex_pattern: "(?:^|\\b)([A-D])(?:\\.|\\b)"
        group_select: -1
      - function: take_first
  - name: strict_match
    filter:
      - function: "regex"
        regex_pattern: The correct answer is [^A-D]*([A-D])
        group_select: -1
      - function: take_first
num_fewshot: 5
metadata:
  version: 1.0
