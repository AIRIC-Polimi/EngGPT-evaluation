task: italic_from_arc_chat
tag: arc_challenge_chat
dataset_path: Crisp-Unimib/ITALIC
output_type: generate_until
test_split: train
doc_to_text: !function utils.doc_to_text_arc_chat
gen_prefix: 'La risposta corretta è'
doc_to_target: !function utils.doc_to_target
generation_kwargs:
  max_gen_toks: 100
  until:
    - "\n\n"
    - "."
filter_list:
  # - name: remove_whitespace
  #   filter:
  #     - function: remove_whitespace
  #     - function: take_first
  - name: extract_letter
    filter:
      - function: regex
        regex_pattern: "([A-E])"
      - function: take_first
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
num_fewshot: 5
fewshot_split: train
fewshot_delimiter: "\n\n"
metadata:
  version: 1.0