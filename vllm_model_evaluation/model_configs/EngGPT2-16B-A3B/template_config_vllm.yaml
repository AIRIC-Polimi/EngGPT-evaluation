model: vllm
model_args:
  pretrained: # Will be injected by run script
  # Match the model's native dtype (see config.json: "dtype": "bfloat16").
  dtype: bfloat16
  trust_remote_code: true
  enable_thinking: true
  think_end_token: </think>

tasks:
  - none # Will be injected by run script

gen_kwargs:
  max_gen_toks: 35000

include_path: lm_eval_custom_polimi

batch_size: auto
device: cuda:0

apply_chat_template: true
confirm_run_unsafe_code: true

output_path: data # Will be appended by run script
log_samples: true
